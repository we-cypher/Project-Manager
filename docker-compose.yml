services:
  frontend:
    build:
      context: ./worklenz-frontend
      dockerfile: Dockerfile
    image: wecypher-frontend:latest
    ports:
      - "5000:5000"
    depends_on:
      - backend
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - worklenz

  backend:
    build:
      context: ./worklenz-backend
      dockerfile: Dockerfile
    image: wecypher-backend:latest
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # Allows the current published image to start when Google OAuth is not configured.
      # Replace these defaults with real credentials in .env to enable Google sign-in.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://localhost/api/auth/google/verify}
    networks:
      - worklenz
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');const r=http.get('http://localhost:3000/public/health',res=>{process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.setTimeout(5000,()=>{r.destroy();process.exit(1)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - worklenz_minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - worklenz

  # MinIO setup helper - creates default bucket on startup
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c '
        echo "Waiting for MinIO to start...";
        sleep 15;
        for i in 1 2 3 4 5; do
          echo "Attempt $$i to connect to MinIO...";
          if /usr/bin/mc alias set myminio http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin}; then
            echo "Successfully connected to MinIO!";
            /usr/bin/mc mb --ignore-existing myminio/worklenz-bucket;
            /usr/bin/mc policy set public myminio/worklenz-bucket;
            echo "Bucket setup complete. Sleeping...";
            tail -f /dev/null;
          fi
          echo "Connection failed, retrying in 5 seconds...";
          sleep 5;
        done;
        echo "Failed to connect to MinIO after 5 attempts";
        exit 1;
            '
    networks:
      - worklenz
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-worklenz_db}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -d ${DB_NAME:-worklenz_db} -U ${DB_USER:-postgres}",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      # First boot runs apt-get + full schema + ~100 migrations; allow time before failing.
      start_period: 180s
    restart: unless-stopped
    networks:
      - worklenz
    volumes:
      # Bump this name (v2 -> v3, …) in Coolify when you need a clean DB init.
      # Compose volume UI is read-only; renaming creates a new empty volume.
      - worklenz_postgres_data_v7:/var/lib/postgresql/data
      # Mount the whole database dir (file bind-mounts break on Coolify and
      # become empty directories — that blocked 00_init.sh last deploy).
      - ./worklenz-backend/database:/db-init:ro
      - ./pg_backups:/db-init-backups
    command: >
        bash -c '
          set -e
          mkdir -p /docker-entrypoint-initdb.d
          cp /db-init/00_init.sh /docker-entrypoint-initdb.d/00_init.sh
          chmod +x /docker-entrypoint-initdb.d/00_init.sh
          ln -sfn /db-init/sql /docker-entrypoint-initdb.d/sql
          ln -sfn /db-init/migrations /docker-entrypoint-initdb.d/migrations
          ln -sfn /db-init-backups /docker-entrypoint-initdb.d/pg_backups

          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y dos2unix
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache dos2unix
          fi
          dos2unix /docker-entrypoint-initdb.d/00_init.sh 2>/dev/null || true

          exec docker-entrypoint.sh postgres
        '
  db-backup:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-worklenz_db}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./pg_backups:/pg_backups #host dir for backups files
    #setup bassh loop to backup data evey 24h
    command: >
           bash -c 'while true; do
              sleep 86400;
              PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h db -U $$POSTGRES_USER -d $$POSTGRES_DB \
              > /pg_backups/worklenz_db_$$(date +%Y-%m-%d_%H-%M-%S).sql;
              find /pg_backups -type f -name "*.sql" -mtime +30 -delete;
            done'
    restart: unless-stopped
    networks:
      - worklenz

volumes:
  # Bump this suffix if init must re-run on Coolify (old volume stays orphaned until cleaned up).
  worklenz_postgres_data_v7:
  worklenz_minio_data:
  pgdata:

networks:
  worklenz:
